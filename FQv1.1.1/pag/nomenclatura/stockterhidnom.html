 <link rel="stylesheet" type="text/css" href="../../CSS/5.css">

<body>

	<h3 id="nfallos">FALLOS: 0</h3>
</div>
<p id="formulanomenclatura">NOMENCLATURA</p>

<div id="todo">

	<h2 id="a"></h2>

	
<input value="" id="respuesta"><br>  
<br>
<button id="comprobar" type="button" onclick="comprobar()">Comprobar</button>

</div>
<br>

<script>
  var nomenclaturaminuscula=["Hidróxido de litio", "Hidróxido de sodio","Hidróxido de potasio","Hidróxido de rubidio","Hidróxido de cesio","Hidróxido de berilio","Hidróxido de magnesio","Hidróxido de calcio","Hidróxido de estroncio","Hidróxido de bario","Hidróxido de cromo(II)","Hidróxido de cromo(III)","Hidróxido de manganeso(II)","Hidróxido de manganeso(III)","Hidróxido de hierro(II)","Hidróxido de hierro(III)","Hidróxido de cobalto(II)","Hidróxido de cobalto(III)","Hidróxido de níquel(II)","Hidróxido de níquel(III)","Hidróxido de cobre(I)","Hidróxido de cobre(II)","Hidróxido de zinc","Hidróxido de paladio(II)","Hidróxido de paladio(IV)","Hidróxido de platino(II)","Hidróxido de platino(IV)","Hidróxido de plata","Hidróxido de cadmio","Hidróxido de mercurio(I)","Hidróxido de mercurio(II)","Hidróxido de oro(I)","Hidróxido de oro(III)","Hidróxido de boro","Hidróxido de aluminio","Hidróxido de  galio(III)","Hidróxido de indio(I)","Hidróxido de indio(III)","Hidróxido de talio(I)","Hidróxido de talio(III)","Hidróxido de estaño(II)","Hidróxido de  estaño(IV)","Hidróxido de plomo(II)","Hidróxido de  plomo(IV)"]; //18 compuestos
  
  var nomenclatura=["HIDRÓXIDO DE LITIO", "HIDRÓXIDO DE SODIO","HIDRÓXIDO DE POTASIO","HIDRÓXIDO DE RUBIDIO","HIDRÓXIDO DE CESIO","HIDRÓXIDO DE BERILIO","HIDRÓXIDO DE MAGNESIO","HIDRÓXIDO DE CALCIO","HIDRÓXIDO DE ESTRONCIO","HIDRÓXIDO DE BARIO","HIDRÓXIDO DE CROMO(II)","HIDRÓXIDO DE CROMO(III)","HIDRÓXIDO DE MANGANESO(II)","HIDRÓXIDO DE MANGANESO(III)","HIDRÓXIDO DE HIERRO(II)","HIDRÓXIDO DE HIERRO(III)","HIDRÓXIDO DE COBALTO(II)","HIDRÓXIDO DE COBALTO(III)","HIDRÓXIDO DE NÍQUEL(II)","HIDRÓXIDO DE NÍQUEL(III)","HIDRÓXIDO DE COBRE(I)","HIDRÓXIDO DE COBRE(II)","HIDRÓXIDO DE ZINC","HIDRÓXIDO DE PALADIO(II)","HIDRÓXIDO DE PALADIO(IV)","HIDRÓXIDO DE PLATINO(II)","HIDRÓXIDO DE PLATINO(IV)","HIDRÓXIDO DE PLATA","HIDRÓXIDO DE CADMIO","HIDRÓXIDO DE MERCURIO(I)","HIDRÓXIDO DE MERCURIO(II)","HIDRÓXIDO DE ORO(I)","HIDRÓXIDO DE ORO(III)","HIDRÓXIDO DE BORO","HIDRÓXIDO DE ALUMINIO","HIDRÓXIDO DE  GALIO(III)","HIDRÓXIDO DE INDIO(I)","HIDRÓXIDO DE INDIO(III)","HIDRÓXIDO DE TALIO(I)","HIDRÓXIDO DE TALIO(III)","HIDRÓXIDO DE ESTAÑO(II)","HIDRÓXIDO DE  ESTAÑO(IV)","HIDRÓXIDO DE PLOMO(II)","HIDRÓXIDO DE  PLOMO(IV)"]; //18 COMPUESTOS
  
  var formula= ["LiOH","NaOH","KOH","RbOH","CsOH","Be(OH)2","Mg(OH)2","Ca(OH)2","Sr(OH)2","Ba(OH)2","Cr(OH)2","Cr(OH)3" ,"Mn(OH)2" ,"Mn(OH)3","Fe(OH)2" ,"Fe(OH)3" ,"Co(OH)2" ,"Co(OH)3","Ni(OH)2","Ni(OH)3","CuOH","Cu(OH)2","Zn(OH)2","Pd(OH)2","Pd(OH)4","Pt(OH)2","Pt(OH)4","AgOH","Cd(OH)2","HgOH","Hg(oH)2","AuOH","Au(OH)3","B(OH)3","Al(OH)3","Ga(OH)3","InOH,In(OH)3","TlOH","Tl(OH)3","Sn(OH)2","Sn(OH)4","Pb(OH)2","Pb(OH)4" 
];
	var porcien;
	var numeropregunta=1;
	var aciertos;
	aciertos=0;
	var fallos;
	fallos=0;
	var res,sol, input; 
	//variables respuesta, solución correcta/falsa y la variable para tomar el valor del input
	var i=0;	//i recorre el array
	var corregir; //Esta variable controla para que no puedas corregir varias veces seguidas.
	corregir=0;
	var random;
	random=Math.round(Math.random()*17); //64= a os compuestos que nos de Bea
	document.getElementById('a').innerHTML=formula[random];
	function comprobar() 
	{
		input=document.getElementById('respuesta').value;
		res=input.toUpperCase();
  
		//tomamos el valor escrito en el input
		if (corregir===0 || corregir===1) 
		{
			 //Sirve para que solo puedas darle una vez a corregir
			if(res===nomenclatura[random])
			{
			aciertos++;
			frases();
			//Incrementamos aciertos y los mostramos
			document.getElementById('naciertos').innerHTML= "ACIERTOS: " + aciertos;
			document.getElementById('VoF').style.color="green";

			corregir=2;
			}
			else
			{
			  if(corregir===0){
			    //fallos++
			corregir++;
			document.getElementById('VoF').innerHTML= "Es incorrecto. Inténtalo de nuevo.";
			document.getElementById('VoF').style.color="red";

			}
			  else{
			    if(corregir===1){
			fallos++;
			corregir++;
			document.getElementById('VoF').innerHTML= "Es incorrecto. Estudia más.";
			document.getElementById('nfallos').innerHTML= "FALLOS: " + fallos;
			document.getElementById('solucion').innerHTML= "La respuesta correcta es: " + nomenclaturaminuscula[random];
			document.getElementById('VoF').style.color="red";
			    }
		}
		}
		}
	}
	function next()
	{
	 if(corregir===2){
		if (numeropregunta<15) 
		{
			i++;
			numeropregunta++;
	  document.getElementById('npregunta').innerHTML= "Pregunta " + numeropregunta + " de 15"
		document.getElementById('respuesta').value="";
		random= Math.round(Math.random()*17);
		document.getElementById('a').innerHTML= formula[random];
		document.getElementById('VoF').innerHTML="";
		document.getElementById('solucion').innerHTML= "";
		corregir=0;
		}
		else
		{
		  document.getElementById('VoF').innerHTML="";
		  document.getElementById('solucion').innerHTML= "";
		  document.getElementById('fin').innerHTML= "RESULTADO DEL TEST";
		  porcien= aciertos * 100 / 15;
		  document.getElementById('porcentaje').innerHTML= "Porcentaje de aciertos= " + porcien.toFixed(0) + "%";
		  
       if (0<=porcien){	document.getElementById('porcentajes').innerHTML= "Ufff! Aún te falta mucho,vuelve a intentarlo... ";}
		   if (25<=porcien){	document.getElementById('porcentajes').innerHTML= "Bueno, tendrás que mejorar para aprobar.";}
		   if (50<=porcien){	document.getElementById('porcentajes').innerHTML= "Bien hecho campeón ;)";}
	     if (75<=porcien){	document.getElementById('porcentajes').innerHTML= "Madre mía, no hace falta que hagas el examen, que te pongan el 10 en este momento.";}
	       document.getElementById("div1").style.display="none";
  		document.getElementById("final").style.display="block";
  }
	}
	}
