<html>

 <link rel="stylesheet" type="text/css" href="../../CSS/5.css">

<body>

	<h3 id="nfallos">FALLOS: 0</h3>
</div>
<p id="formulanomenclatura">NOMENCLATURA</p>
<p id="npregunta">Pregunta 1 de 15</p>
<div id="todo">
	<p id="formulacompuesto"> ¿Qué compuesto es este? </p>
	<h2 id="a"></h2>

	
<input value="" id="respuesta"><br>  
<br>
<button id="comprobar" type="button" onclick="comprobar()">Comprobar</button>
<button id="next" type="button" onclick="next()">Siguiente</button>
</div>
<br>
<div id="div1">

<p id="solucion"></p>
</div>
<div id="final">
<p id="fin">

<p id="porcentajes"></p>
</div>
<script>
  var nomenclaturaminuscula=["Hidruro de litio","Hidruro de sodio","Hidruro de potasio","Hidruro de rubidio","Hidruro de cesio","Hidruro de berilio","Hidruro de magnesio","Hidruro de calcio","Hidruro de estroncio","Hidruro de bario","Hidruro de cromo(II)","Hidruro de cromo(III)","Hidruro de cromo(VI)","Hidruro de manganeso(II)","Hidruro de manganeso(III)","Hidruro de manganeso(VI)","Hidruro de hierro(II)","Hidruro de hierro(III)","Hidruro de cobalto(II)","Hidruro de cobalto(III)","Hidruro de níquel(II)","Hidruro de níquel(III)","Hidruro de cobre(I)","Hidruro de cobre(II)","Hidruro de zinc","Hidruro de paladio(II)","Hidruro de paladio(IV)","Hidruro de platino(II)","Hidruro de platino(IV)","Hidruro de plata","Hidruro de cadmio","Hidruro de mercurio(I)","Hidruro de mercurio(II)","Hidruro de oro(I)","Hidruro de oro(III)","Hidruro de boro","Hidruro de aluminio","Hidruro de galio(III)","Hidruro de indio(I)","Hidruro de indio(III)","Hidruro de talio(I)","Hidruro de talio(III)","Hidruro de carbono(IV)","Tetrahidruro de silicio","Hidruro de germanio(II)","Hidruro de germanio(IV)","Hidruro de estaño(II)","Hidruro de estaño(IV)","Hidruro de plomo(II)","Hidruro de plomo(IV)","Hidruro de nitrógeno(III)","Hidruro de fósforo(III)","Hidruro de arsénico(III)","Hidruro de arsénico(V)","Hidruro de antimonio(III)","Hidruro de antimonio(V)","Hidruro de bismuto(III)","Hidruro de bismuto(V)","Sulfuro de hidrógeno","Selenuro de hidrógeno","Telururo de hidrógeno","Fluoruro de hidrógeno","Cloruro de hidrógeno","Bromuro de hidrógeno","Yoduro de hidrógeno"]; //65 compuestos
  
  var nomenclatura=["HIDRURO DE LITIO","HIDRURO DE SODIO","HIDRURO DE POTASIO","HIDRURO DE RUBIDIO","HIDRURO DE CESIO","HIDRURO DE BERILIO","HIDRURO DE MAGNESIO","HIDRURO DE CALCIO"," HIDRURO DE ESTRONCIO","HIDRURO DE BARIO","HIDRURO DE CROMO(II)","HIDRURO DE CROMO(III)","HIDRURO DE CROMO(VI)","HIDRURO DE MANGANESO(II)","HIDRURO DE MANGANESO(III)","HIDRURO DE MANGANESO(VI)","HIDRURO DE HIERRO(II)","HIDRURO DE HIERRO(III)","HIDRURO DE COBALTO(II)","HIDRURO DE COBALTO(III)","HIDRURO DE NÍQUEL(II)","HIDRURO DE NÍQUEL(III)","HIDRURO DE COBRE(I)","HIDRURO DE COBRE(II)","HIDRURO DE ZINC","HIDRURO DE PALADIO(II)","HIDRURO DE PALADIO(IV)","HIDRURO DE PLATINO(II)","HIDRURO DE PLATINO(IV)","HIDRURO DE PLATA","HIDRURO DE CADMIO","HIDRURO DE MERCURIO(I)","HIDRURO DE MERCURIO(II)","HIDRURO DE ORO(I)","HIDRURO DE ORO(III)","HIDRURO DE BORO","HIDRURO DE ALUMINIO","HIDRURO DE GALIO(III)","HIDRURO DE INDIO(I)","HIDRURO DE INDIO(III)","HIDRURO DE TALIO(I)","HIDRURO DE TALIO(III)","HIDRURO DE CARBONO(IV)","	TETRAHIDRURO DE SILICIO","HIDRURO DE GERMANIO(II)","HIDRURO DE GERMANIO(IV)","HIDRURO DE ESTAÑO(II)","HIDRURO DE ESTAÑO(IV)","HIDRURO DE PLOMO(II)","HIDRURO DE PLOMO(IV)","HIDRURO DE NITRÓGENO(III)","HIDRURO DE FÓSFORO(III)","HIDRURO DE ARSÉNICO(III)","HIDRURO DE ARSÉNICO(V)","HIDRURO DE ANTIMONIO(III)","HIDRURO DE ANTIMONIO(V)","HIDRURO DE BISMUTO(III)","HIDRURO DE BISMUTO(V)","SULFURO DE HIDRÓGENO","SELENURO DE HIDRÓGENO","TELURURO DE HIDRÓGENO","FLUORURO DE HIDRÓGENO", "CLORURO DE HIDRÓGENO","BROMURO DE HIDRÓGENO","YODURO DE HIDRÓGENO"];
  
  var formula= ["LiH","NaH","KH","RbH","CsH","BeH2","MgH2","CaH2","SrH2","BaH2","CrH2","CrH3","CrH6","MnH2","MnH3 ","MnH6","FeH2","FeH3","CoH2","CoH3 ","NiH2","NiH3 ","CuH","CuH2","ZnH2","PdH2","PdH2","PtH2","PtH4","AgH","CdH2","HgH","HgH2 ","AuH","AuH3 ","BH3","AlH3","GaH3","InH","InH3","TlH","TlH3","CH4 ","SiH4","GeH2 ","GeH4","SnH2","SnH4 ","PbH2","PbH4","NH3","PH3","AsH3","AsH5 ","SbH3 ","SbH5","BiH3","BiH5","H2S","H2Se","H2Te","HF","HCl","HBr","HI"];
	var porcien;
	var numeropregunta=1;
	var aciertos;
	aciertos=0;
	var fallos;
	fallos=0;
	var res,sol, input; 
	//variables respuesta, solución correcta/falsa y la variable para tomar el valor del input
	var i=0;	//i recorre el array
	var corregir; //Esta variable controla para que no puedas corregir varias veces seguidas.
	corregir=0;
	var random;
	random=Math.round(Math.random()*64); //64= a os compuestos que nos de Bea
	document.getElementById('a').innerHTML=formula[random];
	function comprobar() 
	{
		input=document.getElementById('respuesta').value;
		res=input.toUpperCase();
  
		//tomamos el valor escrito en el input
		if (corregir===0 || corregir===1) 
		{
			 //Sirve para que solo puedas darle una vez a corregir
			if(res===nomenclatura[random])
			{
			aciertos++;
			frases();
			//Incrementamos aciertos y los mostramos
			document.getElementById('naciertos').innerHTML= "ACIERTOS: " + aciertos;
			document.getElementById('VoF').style.color="green";

			corregir=2;
			}
			else
			{
			  if(corregir===0){
			    //fallos++
			corregir++;
			document.getElementById('VoF').innerHTML= "Es incorrecto. Inténtalo de nuevo.";
			document.getElementById('VoF').style.color="red";

			}
			  else{
			    if(corregir===1){
			fallos++;
			corregir++;
			document.getElementById('VoF').innerHTML= "Es incorrecto. Estudia más.";
			document.getElementById('nfallos').innerHTML= "FALLOS: " + fallos;
			document.getElementById('solucion').innerHTML= "La respuesta correcta es: " + nomenclaturaminuscula[random];
			document.getElementById('VoF').style.color="red";
			    }
		}
		}
		}
	}
	function next()
	{
	 if(corregir===2){
		if (numeropregunta<15) 
		{
			i++;
			numeropregunta++;
	  document.getElementById('npregunta').innerHTML= "Pregunta " + numeropregunta + " de 15"
		document.getElementById('respuesta').value="";
		random= Math.round(Math.random()*64);
		document.getElementById('a').innerHTML= formula[random];
		document.getElementById('VoF').innerHTML="";
		document.getElementById('solucion').innerHTML= "";
		corregir=0;
		}
		else
		{
		  document.getElementById('VoF').innerHTML="";
		  document.getElementById('solucion').innerHTML= "";
		  document.getElementById('fin').innerHTML= "RESULTADO DEL TEST";
		  porcien= aciertos * 100 / 15;
		  document.getElementById('porcentaje').innerHTML= "Porcentaje de aciertos= " + porcien.toFixed(0) + "%";
		  
       if (0<=porcien){	document.getElementById('porcentajes').innerHTML= "Ufff! Aún te falta mucho,vuelve a intentarlo... ";}
		   if (25<=porcien){	document.getElementById('porcentajes').innerHTML= "Bueno, tendrás que mejorar para aprobar.";}
		   if (50<=porcien){	document.getElementById('porcentajes').innerHTML= "Bien hecho campeón ;)";}
	     if (75<=porcien){	document.getElementById('porcentajes').innerHTML= "Madre mía, no hace falta que hagas el examen, que te pongan el 10 en este momento.";} 
	       document.getElementById("div1").style.display="none";
  		document.getElementById("final").style.display="block";
  }
	}
	}
</script>
