<!DOCTYPE html>
<html>
<meta charset="utf-8">
	<title>Formulación</title>
 <link rel="stylesheet" type="text/css" href="../../CSS/5.css">
 <script src="../../js/frase.js" language="Javascript"></script>

</head>
<body>
<h1>Hidruros (Sistemática)</h1>
<div id="acifallos">
	<h3 id="naciertos">ACIERTOS: 0</h3>
	<h3 id="nfallos">FALLOS: 0</h3>
</div>
<p id="formulanomenclatura">FORMULACIÓN</p>
<p id="npregunta">Pregunta 1 de 15</p>
<div id="todo">
	<p id="formulacompuesto"> ¿Qué fórmula tiene este compuesto? </p>
	<h2 id="a"></h2>

	
<input value="" id="respuesta"><br>  
<br>
<button id="comprobar" type="button" onclick=comprobar()>Comprobar</button>
<button id="next" type="button" onclick=next()>Siguiente</button>
</div>
<br>
<div id="div1">
<p id="VoF"></p>
<p id="solucion"></p>
</div>
<div id="final">
<p id="fin">
<p id="porcentaje"></p>
<p id="porcentajes"></p>
</div>

<script>
  var nomenclatura=["Hidruro de litio","Hidruro de sodio","Hidruro de potasio","Hidruro de rubidio","Hidruro de cesio","Hidruro de berilio","Hidruro de magnesio","Hidruro de calcio","Hidruro de estroncio","Hidruro de bario","Dihidruro de cromo","Trihidruro de cromo","Hexahidruro de cromo","Dihidruro de manganeso","Trihidruro de manganeso","Hexahidruro de manganeso","Dihidruro de hierro","Trihidruro de hierro","Dihidruro de cobalto","Trihidruro de cobalto","Dihidruro de níquel","Trihidruro de níquel","Hidruro de cobre","Dihidruro de cobre","Hidruro de zinc","Dihidruro de paladio","Tetrahidruro de paladio","Dihidruro de platino","Tetrahidruro de platino","Hidruro de plata","Hidruro de cadmio","Hidruro de mercurio","Hidruro de mercurio","Hidruro de oro","Trihidruro de oro","Hidruro de boro","Hidruro de aluminio","trihidruro de galio","Hidruro de indio","Trihidruro de indio","Hidruro de talio","Trihidruro de talio","Tetrahidruro de carbono","Tetrahidruro de silicio","Dihidruro de germanio","Tetrahidruro de germanio","Dihidruro de estaño","Tetrahidruro de estaño","Dihidruro de  plomo","Tetrahidruro de plomo","Trihidruro de nitrógeno","Trihidruro de fósforo","Trihidruro de arsénico","Pentahidruro de arsénico","Trihidruro de antimonio","Pentahidruro de antimonio","Trihidruro de bismuto","Pentahidruro de bismuto","Sulfuro de hidrógeno","Selenuro de hidrógeno","Telururo de hidrógeno","Fluoruro de hidrógeno","Cloruro de hidrógeno","Bromuro de hidrógeno","Yoduro de hidrógeno"]; //65 compuestos
  
  var formula= ["LIH","NAH","KH","RBH","CSH","BEH2","MGH2","CAH2","SRH2","BAH2","CRH2","CRH3","CRH6","MNH2","MNH3","MNH6","FEH2","FEH3","COH2","COH3","NIH2","NIH3","CUH","CUH2","ZNH2","PDH2","PDH4","PTH2","PTH4","AGH","CDH2","HGH","HGH2 ","AUH","AUH3 ","BH3","ALH3","GAH3","INH","INH3","TLH","TLH3","CH4","SIH4","GEH2","GEH4","SNH2","SNH4","PBH2","PBH4","NH3","PH3","ASH3","ASH5","SBH3","SBH5","BIH3","BIH5","H2S","H2SE","H2TE","HF","HCL","HBR","HI"];
  
  var formulaminuscula= ["LiH","NaH","KH","RbH","CsH","BeH2","MgH2","CaH2","SrH2","BaH2","CrH2","CrH3","CrH6","MnH2","MnH3 ","MnH6","FeH2","FeH3","CoH2","CoH3 ","NiH2","NiH3 ","CuH","CuH2","ZnH2","PdH2","PdH4","PtH2","PtH4","AgH","CdH2","HgH","HgH2 ","AuH","AuH3 ","BH3","AlH3","GaH3","InH","InH3","TlH","TlH3","CH4 ","SiH4","GeH2 ","GeH4","SnH2","SnH4 ","PbH2","PbH4","NH3","PH3","AsH3","AsH5 ","SbH3 ","SbH5","BiH3","BiH5","H2S","H2Se","H2Te","HF","HCl","HBr","HI"];
	var porcien;
	var numeropregunta=1;
	var aciertos;
	aciertos=0;
	var fallos;
	fallos=0;
	var res,sol, input; 
	//variables respuesta, solución correcta/falsa y la variable para tomar el valor del input
	var i=0;	//i recorre el array
	var corregir; //Esta variable controla para que no puedas corregir varias veces seguidas.
	corregir=0;
	var random;
	random=Math.round(Math.random()*64); //64= a os compuestos que nos de Bea
	document.getElementById('a').innerHTML=nomenclatura[random];
	function comprobar() 
	{
		input=document.getElementById('respuesta').value;
		res=input.toUpperCase();
  
		//tomamos el valor escrito en el input
		if (corregir===0 || corregir===1) 
		{
			 //Sirve para que solo puedas darle una vez a corregir
			if(res===formula[random])
			{
			aciertos++;
			frases();
			//Incrementamos aciertos y los mostramos
			document.getElementById('naciertos').innerHTML= "ACIERTOS: " + aciertos;
			document.getElementById('VoF').style.color="green";

			corregir=2;
			}
			else
			{
			  if(corregir===0){
			    //fallos++
			corregir++;
			document.getElementById('VoF').innerHTML= "Es incorrecto. Inténtalo de nuevo.";
			document.getElementById('VoF').style.color="red";

			}
			  else{
			    if(corregir===1){
			fallos++;
			corregir++;
			document.getElementById('VoF').innerHTML= "Es incorrecto. Estudia más.";
			document.getElementById('nfallos').innerHTML= "FALLOS: " + fallos;
			document.getElementById('solucion').innerHTML= "La respuesta correcta es: " + formulaminuscula[random];
			document.getElementById('VoF').style.color="red";
			    }
		}
		}
		}
	}
	function next()
	{
	 if(corregir===2){
		if (numeropregunta<15) 
		{
			i++;
			numeropregunta++;
	  document.getElementById('npregunta').innerHTML= "Pregunta " + numeropregunta + " de 15"
		document.getElementById('respuesta').value="";
		random= Math.round(Math.random()*64);
		document.getElementById('a').innerHTML= nomenclatura[random];
		document.getElementById('VoF').innerHTML="";
		document.getElementById('solucion').innerHTML= "";
		corregir=0;
		}
		else
		{
		  document.getElementById('VoF').innerHTML="";
		  document.getElementById('solucion').innerHTML= ""
		  document.getElementById('fin').innerHTML= "RESULTADO DEL TEST";;
		  porcien= aciertos * 100 / 15;
		  porcien= porcien.toFixed(0);
		  document.getElementById('porcentaje').innerHTML= "Porcentaje de aciertos= " + porcien + "%";
		   
		   if (0<=porcien){	document.getElementById('porcentajes').innerHTML= "Ufff! Aún te falta mucho,vuelve a intentarlo... ";}
		   if (25<=porcien){	document.getElementById('porcentajes').innerHTML= "Bueno, tendrás que mejorar para aprobar.";}
		   if (50<=porcien){	document.getElementById('porcentajes').innerHTML= "Bien hecho campeón ;)";}
	     if (75<=porcien){	document.getElementById('porcentajes').innerHTML= "Madre mía, no hace falta que hagas el examen, que te pongan el 10 en este momento.";} 
	     document.getElementById("div1").style.display="none";
  		document.getElementById("final").style.display="block";

	  }
  }
	}
</script>
</body>
</html>
